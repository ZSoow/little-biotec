<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>My Little Biotec - Beta 0.6 (Civilisation)</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #e2e8f0;
            overflow: hidden;
        }

        /* --- ZONES --- */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-image: radial-gradient(#cbd5e0 2px, transparent 2px);
            background-size: 25px 25px;
            background-color: #ffffff;
        }

        #sidebar {
            width: 360px;
            background-color: #2d3748;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 20;
        }

        h2 { margin-top: 0; text-align: center; color: #a0aec0; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; }
        
        #stats { text-align: center; margin-bottom: 20px; font-size: 12px; color: #a0aec0; border-bottom: 1px solid #4a5568; padding-bottom: 10px;}
        #stats b { color: #63b3ed; }

        /* --- ÉLÉMENTS --- */
        .element {
            width: 80px;
            height: 80px;
            background-color: white;
            border: 3px solid #cbd5e0;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: absolute;
            font-size: 28px;
            z-index: 10;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .element span {
            font-size: 9px;
            margin-top: 4px;
            color: #4a5568;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            pointer-events: none;
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Styles Sidebar */
        #library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            padding-top: 10px;
        }

        .element-source {
            width: 70px;
            height: 70px;
            background-color: #4a5568;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e2e8f0;
            font-size: 24px;
            border: 2px solid transparent;
            transition: all 0.2s;
            position: relative;
        }
        
        .element-source:hover { background-color: #718096; transform: translateY(-2px); border-color: #63b3ed; }
        .element-source span { font-size: 9px; margin-top: 5px; text-align: center; }

        /* --- UI UTILS --- */
        #trash {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #feb2b2;
            color: #c53030;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            border: 2px dashed #c53030;
            opacity: 0.6;
            transition: all 0.3s;
        }
        #trash.active { opacity: 1; transform: scale(1.1); background: #fc8181; color: white; border-style: solid;}

        /* Animation de découverte */
        @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .new-discovery { animation: pop 0.6s ease-out; box-shadow: 0 0 25px #f6e05e; border-color: #f6e05e !important; z-index: 100 !important; }
    </style>
</head>
<body>

    <div id="workspace">
        <div id="trash">♻️</div>
    </div>

    <div id="sidebar">
        <h2>Monde</h2>
        <div id="stats">Découvertes : <span id="count">0</span> / <span id="total">0</span></div>
        <div id="library"></div>
    </div>

    <script>
        // --- 1. DATA (L'Encyclopédie Complète) ---
        
        const elementsDB = {
            // --- 1. ÉLÉMENTS NATURELS ---
            "terre": { name: "Terre", icon: "🌍", color: "#795548" },
            "eau": { name: "Eau", icon: "💧", color: "#63b3ed" },
            "feu": { name: "Feu", icon: "🔥", color: "#e53e3e" },
            "air": { name: "Air", icon: "🌫️", color: "#a0aec0" },
            "soleil": { name: "Soleil", icon: "☀️", color: "#f6e05e" },
            
            // --- 2. GÉOLOGIE & MÉTÉO ---
            "pierre": { name: "Pierre", icon: "🪨", color: "#718096" },
            "sable": { name: "Sable", icon: "🏜️", color: "#f6e05e" },
            "pluie": { name: "Pluie", icon: "🌧️", color: "#90cdf4" },
            "vent": { name: "Vent", icon: "🍃", color: "#cbd5e0" },
            "vapeur": { name: "Vapeur", icon: "♨️", color: "#e2e8f0" },
            "boue": { name: "Boue", icon: "💩", color: "#5d4037" },

            // --- 3. BIOLOGIE ---
            "microbe": { name: "Microbe", icon: "🦠", color: "#9f7aea" },
            "graine": { name: "Graine", icon: "🌰", color: "#d69e2e" },
            "algue": { name: "Algue", icon: "🌿", color: "#38a169" },
            "arbre": { name: "Arbre", icon: "🌳", color: "#2f855a" },
            "foret": { name: "Forêt", icon: "🌲", color: "#22543d" },
            "fleur": { name: "Fleur", icon: "🌺", color: "#ed64a6" },
            "humain": { name: "Humain", icon: "🧑", color: "#fbd38d" },
            "animal": { name: "Animal", icon: "🐄", color: "#ed8936" },

            // --- 4. RESSOURCES AGRICOLES ---
            "mais": { name: "Maïs", icon: "🌽", color: "#f6ad55" },
            "ble": { name: "Blé", icon: "🌾", color: "#ecc94b" },
            "bois": { name: "Bois", icon: "🪵", color: "#c05621" },
            "canne": { name: "Canne à sucre", icon: "🎋", color: "#9ae6b4" },
            "lait": { name: "Lait", icon: "🥛", color: "#fff" },

            // --- 5. ALIMENTATION (NOUVEAU) ---
            "farine": { name: "Farine", icon: "🥡", color: "#fffff0" },
            "pate": { name: "Pâte", icon: "🥟", color: "#fefcbf" },
            "pain": { name: "Pain", icon: "🥖", color: "#d69e2e" },
            "biere": { name: "Bière", icon: "🍺", color: "#f6e05e" },
            "sucre": { name: "Sucre", icon: "🧂", color: "#fff" },

            // --- 6. INDUSTRIE & TRANSFORMATION ---
            "energie": { name: "Énergie", icon: "⚡", color: "#f6e05e" },
            "electricite": { name: "Électricité", icon: "💡", color: "#faf089" },
            "dechets": { name: "Déchets", icon: "🗑️", color: "#718096" },
            "metal": { name: "Métal", icon: "🔩", color: "#cbd5e0" },
            "verre": { name: "Verre", icon: "🥃", color: "#a3bffa" },
            "brique": { name: "Brique", icon: "🧱", color: "#c05621" },
            "outil": { name: "Outil", icon: "🔨", color: "#4a5568" },

            // --- 7. CHIMIE VERTE ---
            "amidon": { name: "Amidon", icon: "🍚", color: "#fff5f5" },
            "cellulose": { name: "Cellulose", icon: "📄", color: "#fc8181" },
            "bioplastique": { name: "Bio-Plastique", icon: "🥤", color: "#68d391" },
            "biogaz": { name: "Biogaz", icon: "💨", color: "#81e6d9" },
            "engrais": { name: "Engrais", icon: "💩", color: "#48bb78" },
            "bioethanol": { name: "Bioéthanol", icon: "⛽", color: "#ed8936" },

            // --- 8. CIVILISATION & VILLE ---
            "maison": { name: "Maison", icon: "🏠", color: "#ecc94b" },
            "usine": { name: "Usine", icon: "🏭", color: "#718096" },
            "ville": { name: "Ville", icon: "🏙️", color: "#a0aec0" },
            "ferme": { name: "Ferme", icon: "🚜", color: "#48bb78" },
            "eolienne": { name: "Éolienne", icon: "🌬️", color: "#e2e8f0" },
            "panneau": { name: "Panneau Solaire", icon: "🔋", color: "#2c5282" },
            "voiture": { name: "Voiture", icon: "🚗", color: "#38b2ac" },
            "avion": { name: "Avion", icon: "✈️", color: "#63b3ed" },

            // --- 9. CONSÉQUENCES ---
            "pollution": { name: "Pollution", icon: "☠️", color: "#2d3748" },
            "co2": { name: "CO2", icon: "☁️", color: "#718096" }
        };

        const recipes = [
            // --- BASES PHYSIQUES ---
            { a: "terre", b: "terre", result: "pierre" },
            { a: "pierre", b: "eau", result: "sable" }, // Erosion
            { a: "pierre", b: "feu", result: "metal" }, // Extraction
            { a: "sable", b: "feu", result: "verre" },
            { a: "terre", b: "eau", result: "boue" },
            { a: "boue", b: "feu", result: "brique" },
            { a: "air", b: "eau", result: "pluie" },
            { a: "air", b: "air", result: "vent" },
            { a: "eau", b: "feu", result: "vapeur" },
            { a: "vapeur", b: "air", result: "co2" }, // Simplification

            // --- VIVANT ---
            { a: "terre", b: "graine", result: "arbre" },
            { a: "arbre", b: "arbre", result: "foret" },
            { a: "eau", b: "soleil", result: "algue" },
            { a: "graine", b: "soleil", result: "fleur" },
            { a: "humain", b: "graine", result: "ble" }, // Agriculture primitive
            { a: "humain", b: "animal", result: "lait" }, // Élevage

            // --- OUTILS & ÉNERGIE (CORRIGÉ !) ---
            { a: "bois", b: "metal", result: "outil" },
            { a: "feu", b: "bois", result: "energie" }, // Le moyen le plus simple
            { a: "vent", b: "metal", result: "eolienne" },
            { a: "eolienne", b: "vent", result: "electricite" },
            { a: "soleil", b: "verre", result: "panneau" },
            { a: "panneau", b: "soleil", result: "electricite" },
            { a: "vapeur", b: "metal", result: "energie" }, // Machine à vapeur

            // --- TRANSFORMATIONS (AMIDON ET AUTRES) ---
            { a: "mais", b: "outil", result: "amidon" }, // Maïs broyé
            { a: "mais", b: "eau", result: "amidon" },   // Maïs trempé (Alternative)
            { a: "ble", b: "pierre", result: "farine" },
            { a: "farine", b: "eau", result: "pate" },
            { a: "pate", b: "feu", result: "pain" },
            { a: "ble", b: "microbe", result: "biere" }, // Fermentation
            { a: "canne", b: "outil", result: "sucre" },
            { a: "sucre", b: "microbe", result: "bioethanol" },
            
            // --- INDUSTRIE BIO ---
            { a: "amidon", b: "microbe", result: "bioplastique" },
            { a: "bois", b: "usine", result: "cellulose" },
            { a: "bois", b: "outil", result: "papier" }, // Méthode artisanale
            { a: "dechets", b: "microbe", result: "biogaz" },
            { a: "dechets", b: "terre", result: "engrais" },
            
            // --- VILLE & TRANSPORTS ---
            { a: "brique", b: "brique", result: "maison" },
            { a: "maison", b: "maison", result: "ville" },
            { a: "ville", b: "energie", result: "pollution" }, // Triste réalité
            { a: "pollution", b: "foret", result: "air" }, // Les arbres nettoient l'air !
            { a: "bioplastique", b: "energie", result: "voiture" },
            { a: "metal", b: "bioethanol", result: "avion" }, // Biokérosène

            // --- MÉTIERS ---
            { a: "humain", b: "outil", result: "ferme" },
            { a: "humain", b: "brique", result: "usine" },
        ];

        // Éléments de départ (J'en ai ajouté pour faciliter le début)
        let discovered = ["terre", "eau", "feu", "air", "humain", "soleil", "graine", "microbe", "bois"];

        // --- MOTEUR DE JEU (Optimisé) ---

        const libraryEl = document.getElementById('library');
        const workspaceEl = document.getElementById('workspace');
        const trashEl = document.getElementById('trash');
        const countEl = document.getElementById('count');
        const totalEl = document.getElementById('total');

        function init() {
            renderSidebar();
        }

        function renderSidebar() {
            libraryEl.innerHTML = '';
            
            countEl.innerText = discovered.length;
            totalEl.innerText = Object.keys(elementsDB).length;

            // Trier par ordre alphabétique
            discovered.sort((a,b) => elementsDB[a].name.localeCompare(elementsDB[b].name));
            
            discovered.forEach(key => {
                const data = elementsDB[key];
                if(!data) return;
                
                const div = document.createElement('div');
                div.className = 'element-source';
                div.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
                
                div.onmousedown = (e) => {
                    e.preventDefault();
                    spawnElement(key, e.clientX, e.clientY, true);
                };
                
                libraryEl.appendChild(div);
            });
        }

        function spawnElement(key, x, y, autoDrag = false) {
            const data = elementsDB[key];
            const el = document.createElement('div');
            el.className = 'element';
            el.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
            el.style.borderColor = data.color;
            el.dataset.type = key;
            el.style.left = (x - 40) + 'px';
            el.style.top = (y - 40) + 'px';
            
            workspaceEl.appendChild(el);
            
            if(autoDrag) startDrag(el, x, y);

            el.addEventListener('mousedown', (e) => startDrag(el, e.clientX, e.clientY));
        }

        let activeEl = null;
        let offset = { x: 0, y: 0 };

        function startDrag(el, startX, startY) {
            activeEl = el;
            const rect = el.getBoundingClientRect();
            offset.x = startX - rect.left;
            offset.y = startY - rect.top;
            el.style.zIndex = 1000;
            el.style.cursor = 'grabbing';
            trashEl.classList.add('active');
        }

        document.addEventListener('mousemove', (e) => {
            if (!activeEl) return;
            e.preventDefault();
            activeEl.style.left = (e.clientX - offset.x) + 'px';
            activeEl.style.top = (e.clientY - offset.y) + 'px';
        });

        document.addEventListener('mouseup', (e) => {
            if (!activeEl) return;
            const droppedEl = activeEl;
            activeEl = null;
            droppedEl.style.zIndex = 10;
            droppedEl.style.cursor = 'grab';
            trashEl.classList.remove('active');

            const trashRect = trashEl.getBoundingClientRect();
            const elRect = droppedEl.getBoundingClientRect();
            const elCenter = { x: elRect.left + 40, y: elRect.top + 40 };

            if (elCenter.x > trashRect.left && elCenter.y > trashRect.top) {
                createParticles(elCenter.x, elCenter.y, "#e53e3e");
                droppedEl.remove();
                return;
            }

            checkFusion(droppedEl);
        });

        function checkFusion(el1) {
            const r1 = el1.getBoundingClientRect();
            const c1 = { x: r1.left + 40, y: r1.top + 40 };
            const all = document.querySelectorAll('#workspace .element');
            
            for (let el2 of all) {
                if (el1 === el2) continue;
                const r2 = el2.getBoundingClientRect();
                const c2 = { x: r2.left + 40, y: r2.top + 40 };
                
                if (Math.hypot(c1.x - c2.x, c1.y - c2.y) < 60) {
                    const type1 = el1.dataset.type;
                    const type2 = el2.dataset.type;
                    
                    const recipe = recipes.find(r => 
                        (r.a === type1 && r.b === type2) || 
                        (r.a === type2 && r.b === type1)
                    );

                    if (recipe) {
                        createParticles(c2.x, c2.y, "#f6e05e");
                        el1.remove();
                        el2.remove();
                        spawnElement(recipe.result, (c1.x + c2.x)/2, (c1.y + c2.y)/2);
                        
                        if (!discovered.includes(recipe.result)) {
                            discovered.push(recipe.result);
                            renderSidebar();
                            workspaceEl.lastChild.classList.add('new-discovery');
                        }
                        break; 
                    }
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.backgroundColor = color;
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 50 + 20;
                const anim = p.animate([
                    { transform: `translate(0,0) scale(1)`, opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'ease-out' });
                anim.onfinish = () => p.remove();
            }
        }

        init();
    </script>
</body>
</html>
