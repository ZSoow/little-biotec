<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>My Little Biotec - Beta 0.7</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f4f8;
            overflow: hidden;
        }

        #workspace {
            flex-grow: 1;
            position: relative;
            background-image: radial-gradient(#cbd5e0 2px, transparent 2px);
            background-size: 25px 25px;
            background-color: #ffffff;
        }

        #sidebar {
            width: 350px;
            background-color: #1a202c;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 20;
        }

        h2 { margin-top: 0; text-align: center; color: #a0aec0; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }

        .element {
            width: 80px;
            height: 80px;
            background-color: white;
            border: 3px solid #cbd5e0;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: absolute;
            font-size: 28px;
            z-index: 10;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .element span {
            font-size: 9px;
            margin-top: 4px;
            color: #4a5568;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            pointer-events: none;
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            padding-top: 10px;
        }

        .element-source {
            width: 70px;
            height: 70px;
            background-color: #2d3748;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e2e8f0;
            font-size: 24px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .element-source:hover { background-color: #4a5568; transform: translateY(-2px); border-color: #63b3ed; }
        .element-source span { font-size: 9px; margin-top: 5px; text-align: center; }

        #trash {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #feb2b2;
            color: #c53030;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 2px dashed #c53030;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        #trash.active { opacity: 1; transform: scale(1.1); }

        @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .new-discovery { animation: pop 0.6s ease-out; box-shadow: 0 0 25px #f6e05e; border-color: #f6e05e !important; z-index: 100 !important; }
    </style>
</head>
<body>

    <div id="workspace">
        <div id="trash">🗑️</div>
    </div>

    <div id="sidebar">
        <h2>Laboratoire</h2>
        <div id="library"></div>
    </div>

    <script>
        // --- 1. DATA (BASE DE DONNÉES COMPLÈTE) ---
        
        const elementsDB = {
            // --- BASES (Disponibles au départ) ---
            "eau": { name: "Eau", icon: "💧", color: "#63b3ed" },
            "feu": { name: "Feu", icon: "🔥", color: "#f56565" },
            "terre": { name: "Terre", icon: "🌍", color: "#795548" },
            "air": { name: "Air", icon: "💨", color: "#e2e8f0" },
            "humain": { name: "Humain", icon: "🧑", color: "#fbd38d" },
            "microbe": { name: "Microbes", icon: "🦠", color: "#9f7aea" },
            "graine": { name: "Graine", icon: "🌰", color: "#d69e2e" },
            "dechets": { name: "Déchets", icon: "🗑️", color: "#718096" }, // Réintégré au départ

            // --- NATURE (Niveau 1) ---
            "pluie": { name: "Pluie", icon: "🌧️", color: "#90cdf4" },
            "plante": { name: "Plante", icon: "🌿", color: "#68d391" },
            "bois": { name: "Bois", icon: "🪵", color: "#c05621" },
            "mais": { name: "Maïs", icon: "🌽", color: "#f6ad55" },
            "canne": { name: "Canne à Sucre", icon: "🎋", color: "#9ae6b4" }, // NOUVEAU
            "sucre": { name: "Sucre", icon: "🍬", color: "#fff" }, // NOUVEAU
            "soleil": { name: "Soleil", icon: "☀️", color: "#f6e05e" },
            "vapeur": { name: "Vapeur", icon: "♨️", color: "#edf2f7" },
            "energie": { name: "Énergie", icon: "⚡", color: "#faf089" },
            "pierre": { name: "Pierre", icon: "🪨", color: "#718096" },
            "boue": { name: "Boue", icon: "💩", color: "#5d4037" },

            // --- OUTILS & INFRA (Niveau 2) ---
            "outil": { name: "Outil", icon: "🔨", color: "#a0aec0" }, // NOUVEAU (Pierre + Bois)
            "usine": { name: "Usine", icon: "🏭", color: "#4a5568" }, // Réintégré
            "fer": { name: "Métal", icon: "🔧", color: "#cbd5e0" },
            "verre": { name: "Verre", icon: "🔍", color: "#e2e8f0" },
            "roue": { name: "Roue", icon: "⚙️", color: "#4a5568" },

            // --- CHIMIE & MATÉRIAUX (Niveau 3) ---
            "amidon": { name: "Amidon", icon: "🍚", color: "#fff5f5" },
            "cellulose": { name: "Cellulose", icon: "📄", color: "#fc8181" },
            "biogaz": { name: "Biogaz", icon: "💨", color: "#81e6d9" },
            "biochar": { name: "Biochar", icon: "⚫", color: "#2d3748" },
            "bioethanol": { name: "Bioéthanol", icon: "⛽", color: "#ed8936" },
            "bioplastique": { name: "Bio-Plastique", icon: "🥤", color: "#68d391" },
            "papier": { name: "Papier", icon: "📜", color: "#f7fafc" },
            "tissu": { name: "Textile", icon: "🧶", color: "#fbb6ce" },
            "encre": { name: "Encre", icon: "✒️", color: "#2d3748" },
            "compost": { name: "Compost", icon: "🌱", color: "#48bb78" },

            // --- CIVILISATION (Niveau 4) ---
            "livre": { name: "Livre", icon: "📚", color: "#ecc94b" },
            "meuble": { name: "Meuble", icon: "🪑", color: "#c05621" }, // NOUVEAU
            "maison": { name: "Maison", icon: "🏠", color: "#ed8936" },
            "savant": { name: "Ingénieur", icon: "👨‍🔬", color: "#fff" },
            "agriculteur": { name: "Agriculteur", icon: "👨‍🌾", color: "#48bb78" },
            "voiture": { name: "Voiture Bio", icon: "🚗", color: "#38b2ac" },
            "ville": { name: "Ville Verte", icon: "🏙️", color: "#4299e1" }
        };

        const recipes = [
            // --- 1. LES BASES DE LA NATURE ---
            { a: "eau", b: "feu", result: "vapeur" },
            { a: "vapeur", b: "air", result: "pluie" },
            { a: "feu", b: "air", result: "energie" },
            { a: "feu", b: "terre", result: "pierre" },
            { a: "terre", b: "eau", result: "boue" },
            { a: "feu", b: "energie", result: "soleil" },

            // --- 2. VÉGÉTATION & AGRICULTURE ---
            { a: "terre", b: "graine", result: "plante" },
            { a: "plante", b: "soleil", result: "mais" },
            { a: "plante", b: "eau", result: "canne" }, // Recette Canne
            { a: "plante", b: "temps", result: "bois" }, // Alternative
            { a: "plante", b: "terre", result: "bois" },
            
            // --- 3. PREMIERS OUTILS ---
            { a: "pierre", b: "bois", result: "outil" }, // Outil de base
            { a: "pierre", b: "feu", result: "fer" },
            { a: "fer", b: "energie", result: "usine" }, // Création de l'usine
            { a: "bois", b: "fer", result: "roue" },

            // --- 4. TRANSFORMATIONS (BIOÉCONOMIE) ---
            // Sucre & Amidon
            { a: "canne", b: "outil", result: "sucre" }, // Extraction sucre
            { a: "canne", b: "usine", result: "sucre" },
            { a: "mais", b: "outil", result: "amidon" },
            { a: "mais", b: "usine", result: "amidon" },

            // Bois
            { a: "bois", b: "usine", result: "cellulose" },
            { a: "bois", b: "outil", result: "meuble" }, // Correction du bug "bois + outil"
            { a: "bois", b: "feu", result: "biochar" },

            // Déchets
            { a: "dechets", b: "terre", result: "compost" },
            { a: "dechets", b: "microbe", result: "biogaz" },

            // --- 5. MATÉRIAUX AVANCÉS ---
            { a: "amidon", b: "microbe", result: "bioplastique" }, // Le classique
            { a: "sucre", b: "microbe", result: "bioethanol" }, // Fermentation du sucre
            { a: "mais", b: "microbe", result: "bioethanol" }, // Fermentation directe
            { a: "cellulose", b: "energie", result: "papier" },
            { a: "cellulose", b: "bioplastique", result: "tissu" },
            { a: "biochar", b: "eau", result: "encre" },

            // --- 6. PRODUITS FINIS ---
            { a: "bioplastique", b: "roue", result: "voiture" },
            { a: "papier", b: "encre", result: "livre" },
            { a: "bois", b: "pierre", result: "maison" },
            
            // --- 7. HUMANITÉ ---
            { a: "humain", b: "plante", result: "agriculteur" },
            { a: "humain", b: "livre", result: "savant" },
            { a: "maison", b: "maison", result: "ville" },

            // --- 8. FONCTIONNEMENT ---
            { a: "voiture", b: "bioethanol", result: "voiture" } // Faire le plein
        ];

        // Éléments de départ
        let discovered = ["terre", "eau", "feu", "air", "humain", "graine", "microbe", "dechets"];

        // --- MOTEUR (Optimisé pour éviter les bugs) ---

        const libraryEl = document.getElementById('library');
        const workspaceEl = document.getElementById('workspace');
        const trashEl = document.getElementById('trash');

        function init() {
            renderSidebar();
        }

        function renderSidebar() {
            libraryEl.innerHTML = '';
            discovered.sort().forEach(key => {
                if(!elementsDB[key]) return;
                const data = elementsDB[key];
                const div = document.createElement('div');
                div.className = 'element-source';
                div.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
                
                div.onmousedown = (e) => {
                    e.preventDefault();
                    spawnElement(key, e.clientX, e.clientY, true);
                };
                
                libraryEl.appendChild(div);
            });
        }

        function spawnElement(key, x, y, autoDrag = false) {
            const data = elementsDB[key];
            if (!data) return; // Protection contre les éléments inconnus

            const el = document.createElement('div');
            el.className = 'element';
            el.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
            el.style.borderColor = data.color;
            el.dataset.type = key;
            el.style.left = (x - 40) + 'px';
            el.style.top = (y - 40) + 'px';
            workspaceEl.appendChild(el);
            if(autoDrag) startDrag(el, x, y);
            el.addEventListener('mousedown', (e) => startDrag(el, e.clientX, e.clientY));
        }

        let activeEl = null;
        let offset = { x: 0, y: 0 };

        function startDrag(el, startX, startY) {
            activeEl = el;
            const rect = el.getBoundingClientRect();
            offset.x = startX - rect.left;
            offset.y = startY - rect.top;
            el.style.zIndex = 1000;
            el.style.cursor = 'grabbing';
            trashEl.classList.add('active');
        }

        document.addEventListener('mousemove', (e) => {
            if (!activeEl) return;
            e.preventDefault();
            activeEl.style.left = (e.clientX - offset.x) + 'px';
            activeEl.style.top = (e.clientY - offset.y) + 'px';
        });

        document.addEventListener('mouseup', (e) => {
            if (!activeEl) return;
            const droppedEl = activeEl;
            activeEl = null;
            droppedEl.style.zIndex = 10;
            droppedEl.style.cursor = 'grab';
            trashEl.classList.remove('active');

            const trashRect = trashEl.getBoundingClientRect();
            const elRect = droppedEl.getBoundingClientRect();
            const elCenter = { x: elRect.left + 40, y: elRect.top + 40 };

            if (elCenter.x > trashRect.left && elCenter.y > trashRect.top) {
                createParticles(elCenter.x, elCenter.y, "#e53e3e");
                droppedEl.remove();
                return;
            }
            checkFusion(droppedEl);
        });

        function checkFusion(el1) {
            const r1 = el1.getBoundingClientRect();
            const c1 = { x: r1.left + 40, y: r1.top + 40 };
            const all = document.querySelectorAll('#workspace .element');
            
            for (let el2 of all) {
                if (el1 === el2) continue;
                const r2 = el2.getBoundingClientRect();
                const c2 = { x: r2.left + 40, y: r2.top + 40 };
                
                if (Math.hypot(c1.x - c2.x, c1.y - c2.y) < 60) {
                    const type1 = el1.dataset.type;
                    const type2 = el2.dataset.type;
                    
                    const recipe = recipes.find(r => 
                        (r.a === type1 && r.b === type2) || 
                        (r.a === type2 && r.b === type1)
                    );

                    if (recipe) {
                        // VÉRIFICATION CRITIQUE : Est-ce que le résultat existe dans la DB ?
                        if (!elementsDB[recipe.result]) {
                            console.error("Erreur: Recette trouvée mais résultat inconnu:", recipe.result);
                            return; 
                        }

                        createParticles(c2.x, c2.y, "#f6e05e");
                        el1.remove();
                        el2.remove();
                        spawnElement(recipe.result, (c1.x + c2.x)/2, (c1.y + c2.y)/2);
                        
                        if (!discovered.includes(recipe.result)) {
                            discovered.push(recipe.result);
                            renderSidebar();
                            const newEl = workspaceEl.lastChild;
                            if(newEl) newEl.classList.add('new-discovery');
                        }
                        break; 
                    }
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.backgroundColor = color;
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 50 + 20;
                
                const anim = p.animate([
                    { transform: `translate(0,0) scale(1)`, opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'ease-out' });
                
                anim.onfinish = () => p.remove();
            }
        }

        init();
    </script>
</body>
</html>
