<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>My Little Biotec Beta 0.2</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background-color: #f0f4f8;
            overflow: hidden;
        }

        /* --- ZONES --- */
        #workspace {
            flex-grow: 1;
            position: relative;
            background-image: radial-gradient(#cbd5e0 2px, transparent 2px);
            background-size: 25px 25px;
            background-color: #ffffff;
        }

        #sidebar {
            width: 320px;
            background-color: #1a202c; /* Plus sombre pour le contraste */
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: -4px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 20;
        }

        h2 { margin-top: 0; text-align: center; color: #a0aec0; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; }

        /* --- ÉLÉMENTS --- */
        .element {
            width: 80px;
            height: 80px;
            background-color: white;
            border: 3px solid #cbd5e0;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: grab;
            user-select: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: absolute;
            font-size: 28px;
            z-index: 10;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .element span {
            font-size: 10px;
            margin-top: 4px;
            color: #4a5568;
            font-weight: 700;
            text-align: center;
            line-height: 1;
            pointer-events: none;
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Styles Sidebar */
        #library {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 10px;
            padding-top: 10px;
        }

        .element-source {
            width: 70px;
            height: 70px;
            background-color: #2d3748;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #e2e8f0;
            font-size: 24px;
            border: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .element-source:hover { background-color: #4a5568; transform: translateY(-2px); border-color: #63b3ed; }
        .element-source span { font-size: 9px; margin-top: 5px; text-align: center; }

        /* --- UI UTILS --- */
        #trash {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #feb2b2;
            color: #c53030;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            border: 2px dashed #c53030;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        #trash.active { opacity: 1; transform: scale(1.1); }

        /* Animation de découverte */
        @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .new-discovery { animation: pop 0.6s ease-out; box-shadow: 0 0 25px #f6e05e; border-color: #f6e05e !important; z-index: 100 !important; }
        
        /* Petit badge pour les nouveauxitems */
        .badge-new {
            position: absolute;
            top: -5px; right: -5px;
            background: #f56565; color: white;
            font-size: 8px; padding: 2px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div id="workspace">
        <div id="trash">🗑️</div>
    </div>

    <div id="sidebar">
        <h2>Laboratoire</h2>
        <div id="library"></div>
    </div>

    <script>
        // --- 1. DATA (Bioeconomy Edition) ---
        
        const elementsDB = {
            // --- NIVEAU 0 : Matières Premières ---
            "terre": { name: "Terre", icon: "🌍", color: "#795548" }, // Demandé
            "eau": { name: "Eau", icon: "💧", color: "#63b3ed" },
            "feu": { name: "Feu", icon: "🔥", color: "#e53e3e" },
            "air": { name: "Air", icon: "💨", color: "#a0aec0" },
            "soleil": { name: "Soleil", icon: "☀️", color: "#f6e05e" },

            // --- VIVANT & NATURE ---
            "microbe": { name: "Microbes", icon: "🦠", color: "#9f7aea" },
            "graine": { name: "Graine", icon: "🌰", color: "#d69e2e" },
            "mais": { name: "Maïs", icon: "🌽", color: "#f6ad55" },
            "bois": { name: "Bois", icon: "🪵", color: "#c05621" },
            "foret": { name: "Forêt", icon: "🌲", color: "#2f855a" },
            "algue": { name: "Algues", icon: "🌿", color: "#38a169" }, // Très important pour la bioéconomie
            "humain": { name: "Humain", icon: "🧑", color: "#fbd38d" },

            // --- RESSOURCES & DÉCHETS ---
            "dechets": { name: "Déchets", icon: "🗑️", color: "#718096" },
            "biomasse": { name: "Biomasse", icon: "🍂", color: "#744210" },

            // --- TRANSFORMÉS (Chimie Verte) ---
            "amidon": { name: "Amidon", icon: "🍚", color: "#fff5f5" },
            "cellulose": { name: "Cellulose", icon: "📄", color: "#fc8181" },
            "compost": { name: "Compost", icon: "💩", color: "#48bb78" },
            "biogaz": { name: "Biogaz", icon: "♨️", color: "#81e6d9" },
            "biochar": { name: "Biochar", icon: "⚫", color: "#2d3748" },
            "bioethanol": { name: "Bioéthanol", icon: "⛽", color: "#ed8936" },
            "enzyme": { name: "Enzymes", icon: "🧪", color: "#b794f4" }, // Catalyseur

            // --- MATÉRIAUX ---
            "bioplastique": { name: "Bio-Plastique", icon: "🥤", color: "#68d391" },
            "papier": { name: "Papier", icon: "📜", color: "#f7fafc" },
            "tissu": { name: "Fibre Textile", icon: "🧶", color: "#fbb6ce" },
            "verre": { name: "Verre", icon: "🥃", color: "#a3bffa" },
            "metal": { name: "Métal", icon: "🔩", color: "#cbd5e0" }, // Pour l'industrie

            // --- ACTEURS & MÉTIERS ---
            "agriculteur": { name: "Agriculteur", icon: "👨‍🌾", color: "#68d391" },
            "scientifique": { name: "Scientifique", icon: "👨‍🔬", color: "#63b3ed" },
            "ingenieur": { name: "Ingénieur", icon: "👷", color: "#f6ad55" },

            // --- INFRASTRUCTURES ---
            "champ": { name: "Champ", icon: "🚜", color: "#f0fff4" },
            "usine": { name: "Usine", icon: "🏭", color: "#718096" },
            "labo": { name: "Laboratoire", icon: "🔬", color: "#e2e8f0" },
            "bioraffinerie": { name: "Bioraffinerie", icon: "🏗️", color: "#319795" }, // Le coeur de la bioéconomie
            "panneau": { name: "Panneau Solaire", icon: "🔋", color: "#2c5282" },

            // --- ÉNERGIE ---
            "energie": { name: "Énergie", icon: "⚡", color: "#f6e05e" },
            "electricite": { name: "Électricité", icon: "💡", color: "#faf089" },
            "chaleur": { name: "Chaleur", icon: "🌡️", color: "#e53e3e" },

            // --- PRODUITS FINIS ---
            "livre": { name: "Livre", icon: "📚", color: "#ecc94b" },
            "vetement": { name: "Vêtement", icon: "👕", color: "#b794f4" },
            "batiment": { name: "Bâtiment", icon: "🏢", color: "#a0aec0" },
            "voiture": { name: "Voiture", icon: "🚗", color: "#38b2ac" },
            "medicament": { name: "Médicament", icon: "💊", color: "#fc8181" }
        };

        const recipes = [
            // --- 1. NATURE ET ÉLÉMENTS DE BASE ---
            { a: "terre", b: "eau", result: "biomasse" }, // La boue fertile
            { a: "terre", b: "graine", result: "champ" },
            { a: "champ", b: "eau", result: "mais" },
            { a: "terre", b: "bois", result: "foret" },
            { a: "eau", b: "soleil", result: "algue" }, // Photosynthèse aquatique
            { a: "feu", b: "bois", result: "chaleur" },
            { a: "sable", b: "feu", result: "verre" }, // (Si on ajoute sable un jour, sinon terre+feu = brique/metal brut)
            { a: "terre", b: "feu", result: "metal" }, // Simplification : extraction minière

            // --- 2. ÉDUCATION ET MÉTIERS ---
            { a: "humain", b: "champ", result: "agriculteur" },
            { a: "humain", b: "livre", result: "scientifique" },
            { a: "humain", b: "usine", result: "ingenieur" },
            { a: "scientifique", b: "microbe", result: "enzyme" }, // Découverte biotechnologique

            // --- 3. INFRASTRUCTURES ---
            { a: "metal", b: "energie", result: "usine" },
            { a: "usine", b: "microbe", result: "bioraffinerie" }, // Usine avancée
            { a: "verre", b: "soleil", result: "panneau" }, // Panneau solaire
            { a: "panneau", b: "soleil", result: "electricite" },
            { a: "batiment", b: "microbe", result: "labo" },

            // --- 4. TRANSFORMATIONS (BIOÉCONOMIE) ---
            // Voie Maïs/Plantes
            { a: "mais", b: "usine", result: "amidon" },
            { a: "amidon", b: "enzyme", result: "bioplastique" }, // Plus réaliste avec enzyme
            
            // Voie Bois/Fibres
            { a: "bois", b: "usine", result: "cellulose" },
            { a: "cellulose", b: "energie", result: "papier" },
            { a: "cellulose", b: "enzyme", result: "tissu" }, // Viscose/Lyocell
            
            // Voie Déchets/Circulaire
            { a: "dechets", b: "microbe", result: "biogaz" },
            { a: "dechets", b: "verre", result: "compost" }, // Erreur de ma part, disons Dechets + Terre = Compost
            { a: "dechets", b: "terre", result: "compost" },
            { a: "biogaz", b: "usine", result: "electricite" },

            // Voie Algues (Le futur)
            { a: "algue", b: "bioraffinerie", result: "bioethanol" },
            { a: "algue", b: "labo", result: "medicament" },
            { a: "algue", b: "soleil", result: "bioplastique" }, // Certaines algues font du plastique

            // --- 5. OBJETS FINIS ---
            { a: "papier", b: "humain", result: "livre" },
            { a: "tissu", b: "humain", result: "vetement" },
            { a: "bois", b: "bois", result: "batiment" },
            { a: "bioplastique", b: "ingenieur", result: "voiture" },
            { a: "voiture", b: "bioethanol", result: "voiture" }, // Faire le plein
            { a: "voiture", b: "electricite", result: "voiture" }// (Easter egg: faire le plein ne change rien visuellement mais c'est logique !)
        ];

        // On garde les découvertes de base
         let discovered = ["terre", "eau", "feu", "air", "humain", "soleil", "graine", "dechets", "microbe"];

        // --- 2. ENGINE ---

        const libraryEl = document.getElementById('library');
        const workspaceEl = document.getElementById('workspace');
        const trashEl = document.getElementById('trash');

        function init() {
            renderSidebar();
        }

        function renderSidebar() {
            libraryEl.innerHTML = '';
            // Tri alphabétique
            discovered.sort().forEach(key => {
                const data = elementsDB[key];
                const div = document.createElement('div');
                div.className = 'element-source';
                div.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
                
                div.onmousedown = (e) => {
                    e.preventDefault();
                    spawnElement(key, e.clientX, e.clientY, true);
                };
                
                libraryEl.appendChild(div);
            });
        }

        function spawnElement(key, x, y, autoDrag = false) {
            const data = elementsDB[key];
            const el = document.createElement('div');
            el.className = 'element';
            el.innerHTML = `<div>${data.icon}</div><span>${data.name}</span>`;
            el.style.borderColor = data.color;
            el.dataset.type = key;
            
            // Centrage
            el.style.left = (x - 40) + 'px';
            el.style.top = (y - 40) + 'px';
            
            workspaceEl.appendChild(el);
            
            if(autoDrag) startDrag(el, x, y);

            el.addEventListener('mousedown', (e) => startDrag(el, e.clientX, e.clientY));
        }

        // Drag & Drop
        let activeEl = null;
        let offset = { x: 0, y: 0 };

        function startDrag(el, startX, startY) {
            activeEl = el;
            const rect = el.getBoundingClientRect();
            offset.x = startX - rect.left;
            offset.y = startY - rect.top;
            
            el.style.zIndex = 1000;
            el.style.cursor = 'grabbing';
            trashEl.classList.add('active');
        }

        document.addEventListener('mousemove', (e) => {
            if (!activeEl) return;
            e.preventDefault();
            
            activeEl.style.left = (e.clientX - offset.x) + 'px';
            activeEl.style.top = (e.clientY - offset.y) + 'px';
        });

        document.addEventListener('mouseup', (e) => {
            if (!activeEl) return;

            const droppedEl = activeEl;
            activeEl = null;
            droppedEl.style.zIndex = 10;
            droppedEl.style.cursor = 'grab';
            trashEl.classList.remove('active');

            // 1. Poubelle
            const trashRect = trashEl.getBoundingClientRect();
            const elRect = droppedEl.getBoundingClientRect();
            const elCenter = { x: elRect.left + 40, y: elRect.top + 40 };

            if (elCenter.x > trashRect.left && elCenter.y > trashRect.top) {
                createParticles(elCenter.x, elCenter.y, "#e53e3e");
                droppedEl.remove();
                return;
            }

            // 2. Fusion
            checkFusion(droppedEl);
        });

        function checkFusion(el1) {
            const r1 = el1.getBoundingClientRect();
            const c1 = { x: r1.left + 40, y: r1.top + 40 };

            const all = document.querySelectorAll('#workspace .element');
            
            for (let el2 of all) {
                if (el1 === el2) continue;

                const r2 = el2.getBoundingClientRect();
                const c2 = { x: r2.left + 40, y: r2.top + 40 };
                
                // Distance < 60px = Contact
                const dist = Math.hypot(c1.x - c2.x, c1.y - c2.y);
                
                if (dist < 60) {
                    const type1 = el1.dataset.type;
                    const type2 = el2.dataset.type;
                    
                    const recipe = recipes.find(r => 
                        (r.a === type1 && r.b === type2) || 
                        (r.a === type2 && r.b === type1)
                    );

                    if (recipe) {
                        // Création
                        createParticles(c2.x, c2.y, "#f6e05e");
                        el1.remove();
                        el2.remove();
                        
                        spawnElement(recipe.result, (c1.x + c2.x)/2, (c1.y + c2.y)/2);
                        
                        // Découverte
                        if (!discovered.includes(recipe.result)) {
                            discovered.push(recipe.result);
                            renderSidebar();
                            
                            // Feedback visuel fort
                            const newEl = workspaceEl.lastChild;
                            newEl.classList.add('new-discovery');
                        }
                        break; 
                    }
                }
            }
        }

        function createParticles(x, y, color) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                p.style.width = '6px';
                p.style.height = '6px';
                p.style.backgroundColor = color;
                p.style.borderRadius = '50%';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 50 + 20;
                
                const anim = p.animate([
                    { transform: `translate(0,0) scale(1)`, opacity: 1 },
                    { transform: `translate(${Math.cos(angle)*velocity}px, ${Math.sin(angle)*velocity}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'ease-out' });
                
                anim.onfinish = () => p.remove();
            }
        }

        init();
    </script>
</body>
</html>
